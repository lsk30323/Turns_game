name: Android CI

# 코드를 올릴 때마다(또는 PR마다) GitHub 무료 러너에서 앱 전체(Compose UI 포함)를
# 자동 빌드/테스트한다. 이 러너는 Google Maven 에 접근 가능하므로 :app:assembleDebug 가
# 실제로 돈다(개발 샌드박스에서는 Google Maven 차단으로 불가했던 부분).
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# 같은 브랜치에서 새 푸시가 오면 진행 중인 실행을 취소(러너 시간 절약).
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'   # AGP 8.7 실행에 JDK 17+ 필요

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK (compiles Compose UI + resources)
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Run unit tests (domain rules)
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload test & build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
